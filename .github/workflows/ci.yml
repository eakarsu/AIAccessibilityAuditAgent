name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: app_test }
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=10
    env: { DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/app_test', JWT_SECRET: 'ci-secret-with-at-least-thirty-two-characters', CLIENT_URL: 'http://localhost:3000', RUNTIME_SETUP: '1', RUNTIME_AI_ENDPOINT: '/api/ai/runtime-acceptance', RUNTIME_TENANT_ID: 'ci-tenant', PROVISION_ADMIN_EMAIL: 'ci-admin@example.com', PROVISION_ADMIN_PASSWORD: 'ci-admin-password-123', PROVISION_REVIEWER_EMAIL: 'ci-reviewer@example.com', PROVISION_REVIEWER_PASSWORD: 'ci-reviewer-password-123' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: '**/package-lock.json' }
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: backend
      - run: npm run build
        working-directory: frontend
      - run: ./scripts/migrate.sh
        working-directory: .
      - run: ./scripts/ci-smoke.sh
        working-directory: .
      - run: bash -n start.sh scripts/*.sh
        working-directory: .
